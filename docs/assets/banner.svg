<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </radialGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="12" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="120" cy="100" r="120" fill="url(#orb1)"/>
  <circle cx="600" cy="80" r="100" fill="url(#orb2)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="white" stroke-width="0.5">
    <line x1="0" y1="40" x2="720" y2="40"/>
    <line x1="0" y1="80" x2="720" y2="80"/>
    <line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="160" x2="720" y2="160"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="540" y1="0" x2="540" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="660" y1="0" x2="660" y2="200"/>
  </g>

  <!-- Decorative dots -->
  <g opacity="0.08" fill="white">
    <circle cx="620" cy="40" r="1.5"/>
    <circle cx="640" cy="55" r="1"/>
    <circle cx="660" cy="35" r="1.5"/>
    <circle cx="650" cy="70" r="1"/>
    <circle cx="80" cy="150" r="1.5"/>
    <circle cx="60" cy="165" r="1"/>
    <circle cx="100" cy="160" r="1"/>
  </g>

  <!-- Icon cluster with glow -->
  <g transform="translate(90, 100)" filter="url(#softglow)">
    <text x="-40" y="-30" text-anchor="middle" font-size="24">🔍</text>
    <text x="0" y="5" text-anchor="middle" font-size="28">🧠</text>
    <text x="40" y="-30" text-anchor="middle" font-size="24">⚡</text>
    <text x="-20" y="35" text-anchor="middle" font-size="20">🔒</text>
    <text x="20" y="35" text-anchor="middle" font-size="20">🔧</text>
  </g>

  <!-- Connector lines from icons to title -->
  <g opacity="0.06" stroke="url(#accent)" stroke-width="1">
    <line x1="140" y1="90" x2="195" y2="75"/>
    <line x1="140" y1="100" x2="195" y2="105"/>
  </g>

  <!-- Title -->
  <text x="210" y="72" fill="white" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="-1">
    Skills That I Use
  </text>

  <!-- Subtitle -->
  <text x="210" y="105" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400">
    Custom AI agent skills that supercharge my dev workflow
  </text>

  <!-- Tags row -->
  <g transform="translate(210, 125)">
    <!-- Tag: skills -->
    <rect x="0" y="0" width="58" height="22" rx="11" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="29" y="15" text-anchor="middle" fill="#a78bfa" font-family="system-ui, monospace" font-size="10" font-weight="500">skills</text>

    <!-- Tag: open source -->
    <rect x="68" y="0" width="85" height="22" rx="11" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="0.5"/>
    <text x="110" y="15" text-anchor="middle" fill="#5eead4" font-family="system-ui, monospace" font-size="10" font-weight="500">open source</text>

    <!-- Tag: multi-agent -->
    <rect x="163" y="0" width="85" height="22" rx="11" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="0.5"/>
    <text x="205" y="15" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, monospace" font-size="10" font-weight="500">multi-agent</text>

    <!-- Tag: code review -->
    <rect x="258" y="0" width="90" height="22" rx="11" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="0.5"/>
    <text x="303" y="15" text-anchor="middle" fill="#fcd34d" font-family="system-ui, monospace" font-size="10" font-weight="500">code review</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(210, 158)">
    <rect x="0" y="0" width="40" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="20" y="13" text-anchor="middle" fill="#6b7280" font-family="system-ui, monospace" font-size="9" font-weight="500">v1.0</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="194" width="720" height="6" rx="0 0 12 12" fill="url(#accent)"/>
</svg>
